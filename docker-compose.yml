# =====================================================================
#  Plataforma Inteligente de Soporte Técnico
#  Uso:
#    cp .env.example .env    (y edita los valores)
#    docker compose up -d --build
#  Perfiles opcionales:
#    --profile edge     -> Cloudflare Tunnel (requiere TUNNEL_TOKEN)
#    --profile clamav   -> antivirus de adjuntos (CLAMAV_ENABLED=true)
#    --profile ollama   -> LLM local (LLM_PROVIDER=ollama)
# =====================================================================
name: helpdesk

x-s3-env: &s3-env
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: us-east-1

services:
  # ------------------------------------------------------------------
  # Infraestructura operativa
  # ------------------------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta el archivo .env. Ejecuta ./scripts/preparar-env.sh (o scripts/preparar-env.ps1 en Windows)}
      HELPDESK_DB_PASSWORD: ${HELPDESK_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      LAKE_DB_PASSWORD: ${LAKE_DB_PASSWORD}
      LAKE_READER_PASSWORD: ${LAKE_READER_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # solo para desarrollo local (IntelliJ)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  rabbitmq:
    image: rabbitmq:4.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"  # consola de administración, solo local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [app]

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/seaweedfs/entrypoint.sh"]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
      S3_HELPDESK_ACCESS_KEY: ${S3_HELPDESK_ACCESS_KEY}
      S3_HELPDESK_SECRET_KEY: ${S3_HELPDESK_SECRET_KEY}
      S3_AI_ACCESS_KEY: ${S3_AI_ACCESS_KEY}
      S3_AI_SECRET_KEY: ${S3_AI_SECRET_KEY}
      S3_LAKE_ACCESS_KEY: ${S3_LAKE_ACCESS_KEY}
      S3_LAKE_SECRET_KEY: ${S3_LAKE_SECRET_KEY}
    volumes:
      - s3data:/data
      - ./infrastructure/seaweedfs/entrypoint.sh:/opt/seaweedfs/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [app]

  s3-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/opt/create-buckets.sh"]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
    volumes:
      - ./infrastructure/seaweedfs/create-buckets.sh:/opt/create-buckets.sh:ro
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"
    networks: [app]

  # ------------------------------------------------------------------
  # Servicios de aplicación
  # ------------------------------------------------------------------
  helpdesk-api:
    build: ./helpdesk-api
    restart: unless-stopped
    environment:
      <<: *s3-env
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      DB_USER: helpdesk
      DB_PASSWORD: ${HELPDESK_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      S3_ACCESS_KEY: ${S3_HELPDESK_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_HELPDESK_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_KEY: ${SERVICE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD}
      DEMO_ENABLED: ${DEMO_ENABLED}
      TRINO_URL: jdbc:trino://trino:8080/lake
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_USER: admin
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED}
      CLAMAV_HOST: clamav
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [app]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      <<: *s3-env
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      HELPDESK_URL: http://helpdesk-api:8080
      SERVICE_KEY: ${SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      S3_ACCESS_KEY: ${S3_AI_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_AI_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      VISION_MODEL: ${VISION_MODEL}
      STT_ENABLED: ${STT_ENABLED}
      STT_MODEL: ${STT_MODEL}
      HF_HUB_DISABLE_XET: "1"   # descarga HTTP normal; hf-xet se trababa en Docker Desktop
      TTS_ENABLED: ${TTS_ENABLED}
      TTS_VOICE: ${TTS_VOICE}
      MODELS_DIR: /models
      # Agente de IA del Data Lake (consulta Gold con el usuario de solo lectura de Trino)
      TRINO_HTTP_URL: http://trino:8080
      TRINO_USER: analytics
      LAKE_AGENT_MODE: ${LAKE_AGENT_MODE:-auto}
      LAKE_LLM_MODEL: ${LAKE_LLM_MODEL:-}
    volumes:
      - aimodels:/models
    depends_on:
      rabbitmq: { condition: service_healthy }
      helpdesk-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [app]

  data-ingestion:
    build: ./data-ingestion
    restart: unless-stopped
    environment:
      <<: *s3-env
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      S3_ACCESS_KEY: ${S3_LAKE_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_LAKE_SECRET_KEY}
      LAKE_BUCKET: lake
      FLUSH_SECONDS: "10"
      FLUSH_MAX_EVENTS: "500"
    depends_on:
      rabbitmq: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    networks: [app]

  # ------------------------------------------------------------------
  # Plataforma de datos
  # ------------------------------------------------------------------
  airflow:
    build: ./data-lake
    restart: unless-stopped
    environment:
      <<: *s3-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${LAKE_TIMEZONE}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      HELPDESK_DB_DSN: postgresql://lake_reader:${LAKE_READER_PASSWORD}@postgres:5432/helpdesk
      LAKE_CATALOG_URI: jdbc:postgresql://postgres:5432/lake_catalog
      LAKE_DB_USER: lake
      LAKE_DB_PASSWORD: ${LAKE_DB_PASSWORD}
      S3_ACCESS_KEY: ${S3_LAKE_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_LAKE_SECRET_KEY}
      LAKE_BUCKET: lake
      LAKE_TIMEZONE: ${LAKE_TIMEZONE}
      PSEUDONYM_SALT: ${PSEUDONYM_SALT}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}   # 2 GB: suficiente para ~400.000 eventos (carga masiva)
    volumes:
      - ./data-lake/dags:/opt/airflow/dags
      - ./data-lake/lakehouse:/opt/lakehouse/lakehouse
      - ./data-lake/quality:/opt/lakehouse/quality
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    networks: [app, edge]

  trino:
    image: trinodb/trino:482
    restart: unless-stopped
    environment:
      LAKE_DB_PASSWORD: ${LAKE_DB_PASSWORD}
      S3_LAKE_ACCESS_KEY: ${S3_LAKE_ACCESS_KEY}
      S3_LAKE_SECRET_KEY: ${S3_LAKE_SECRET_KEY}
    volumes:
      - ./infrastructure/trino/catalog:/etc/trino/catalog:ro
      - ./infrastructure/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infrastructure/trino/rules.json:/etc/trino/rules.json:ro
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app]

  # ------------------------------------------------------------------
  # Publicación
  # ------------------------------------------------------------------
  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - helpdesk-api
      - ai-service
    networks: [app, edge]

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    profiles: ["edge"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - nginx
    networks: [edge]

  # ------------------------------------------------------------------
  # Opcionales
  # ------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    networks: [app]

  ollama:
    image: ollama/ollama:0.9.0
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [app]
    # Para GPU NVIDIA descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

networks:
  app:
  edge:

volumes:
  pgdata:
  rabbitdata:
  s3data:
  aimodels:
  clamdb:
  ollama:
