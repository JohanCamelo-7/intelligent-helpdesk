# Nginx: único destino del túnel de Cloudflare y del acceso local.
# Sirve el frontend Angular y enruta /api hacia los servicios internos.

# IP real del cliente: Cloudflare la envía en CF-Connecting-IP.
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Esquema real: detrás de Cloudflare llega X-Forwarded-Proto=https.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

limit_req_zone $client_real_ip zone=login:10m  rate=10r/m;
limit_req_zone $client_real_ip zone=upload:10m rate=30r/m;
limit_req_zone $client_real_ip zone=agent:10m  rate=60r/m;
limit_req_zone $client_real_ip zone=api:10m    rate=20r/s;

upstream helpdesk_api { server helpdesk-api:8080; }
upstream ai_service   { server ai-service:8000; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 5 imágenes x 5 MB + margen. Muy por debajo del límite del plan gratuito de Cloudflare (100 MB).
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_real_ip;
    proxy_set_header X-Forwarded-For   $client_real_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header CF-Connecting-IP  $client_real_ip;
    proxy_read_timeout 90s;   # por debajo del tiempo máximo de Cloudflare (~100 s)

    # --- Agente de IA (texto y voz) -> ai-service ---
    location /api/v1/agent/ {
        limit_req zone=agent burst=20 nodelay;
        proxy_pass http://ai_service;
    }

    # --- Inicio de sesión: limitación estricta ---
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://helpdesk_api;
    }

    # --- Cargas de imágenes ---
    location ~ ^/api/v1/tickets(/[^/]+/adjuntos)?$ {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://helpdesk_api;
    }

    # --- Resto de la API -> helpdesk-api ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://helpdesk_api;
    }

    # Endpoints internos y actuator nunca se publican
    location /internal/ { return 404; }
    location /actuator/ { return 404; }

    # --- Frontend Angular (SPA) ---
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
