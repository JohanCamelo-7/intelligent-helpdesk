connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/lake_catalog
iceberg.jdbc-catalog.connection-user=lake
iceberg.jdbc-catalog.connection-password=${ENV:LAKE_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://lake/warehouse
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_LAKE_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_LAKE_SECRET_KEY}
